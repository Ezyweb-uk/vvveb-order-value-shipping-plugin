  <script>
	document.addEventListener("DOMContentLoaded", function() {
		// 1. Sync hidden input on page load with whichever tab is active
		let activeTabEl = document.querySelector('[data-v-methods] a[data-bs-toggle="tab"].active');
		if (activeTabEl) {
			let allTabs = Array.from(document.querySelectorAll('[data-v-methods] a[data-bs-toggle="tab"]'));
			let activeIdx = allTabs.indexOf(activeTabEl);
			if (activeIdx !== -1) {
				document.getElementById('active_tab').value = activeIdx;
			}
		}

		// 2. Track tab switching when user manually clicks tabs
		document.querySelectorAll('[data-v-methods] a[data-bs-toggle="tab"]').forEach((tabEl) => {
			tabEl.addEventListener('shown.bs.tab', function (e) {
				let allTabs = Array.from(document.querySelectorAll('[data-v-methods] a[data-bs-toggle="tab"]'));
				document.getElementById('active_tab').value = allTabs.indexOf(e.target);
			});
		});
	});

	function addMethodRate(btn) {
		// 1. Find the parent .tab-pane container
		let tabPane = btn.closest('.tab-pane');
		if (!tabPane) return;

		// 2. Extract the exact index from id="tab-0", id="tab-1", etc.
		let methodIndex = 0;
		if (tabPane.id && tabPane.id.startsWith('tab-')) {
			methodIndex = parseInt(tabPane.id.replace('tab-', ''), 10);
		}

		// 3. Clone and re-index inputs for this specific method
		let targetTable = tabPane.querySelector('.rates-table tbody') || tabPane.querySelector('[data-v-rates] tbody');
		let templateRow = tabPane.querySelector('.rate-template');

		if (templateRow && targetTable) {
			let newRow = templateRow.cloneNode(true);
			newRow.classList.remove('d-none', 'rate-template');

			let currentCount = targetTable.querySelectorAll('tr:not(.rate-template)').length;

			newRow.querySelectorAll('input, select').forEach(input => {
				input.removeAttribute('disabled');

				if (input.name) {
					input.name = input.name
						.replace(/methods\[\d+\]/, 'methods[' + methodIndex + ']')
						.replace('[#]', '[' + currentCount + ']');
				}
			});

			targetTable.appendChild(newRow);
		}
	}
  </script>
